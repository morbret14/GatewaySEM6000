; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = cinematique-comptage-hw3

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Configuration Flash 16MB & PSRAM OPI (identique à ton réglage Arduino IDE)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = app3M_fat9M_16MB.csv
board_upload.flash_size = 16MB

; Activation port série natif USB CDC
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Dépendance bibliothèque NimBLE (verrouillée sur la v2.5.2)
lib_deps = 
    h2zero/NimBLE-Arduino @ ^2.5.2

; Vitesse du moniteur série
monitor_speed = 115200

; ====================================================================
; Environnements d'exploration et de test (dossier experiments/)
; ====================================================================

[env:test-ble-scan]
extends = env:esp32-s3-devkitc-1
build_src_filter = -<*> +<../experiments/exp_01_ble_scan.cpp>

